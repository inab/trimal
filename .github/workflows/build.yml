on:
  push:
    branches:
      - trimAl
    paths:
      - '.github/workflows/build.yml'
      - 'dataset/**'
      - 'scripts/**'
      - 'source/**'
  pull_request:
    branches:
      - trimAl
    paths:
      - '.github/workflows/build.yml'
      - 'dataset/**'
      - 'scripts/**'
      - 'source/**'

name: Build 

jobs:
  check_release_binaries_ubuntu:
    #if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check release binaries
        run: |
          curl -L -o trimal_linux.zip https://github.com/inab/trimal/releases/latest/download/trimAl_Linux_x86-64.zip &&
          unzip trimal_linux.zip && cd trimAl_Linux_x86-64 && file trimal && file readal && file statal
          
  test_binaries_ubuntu:
    #if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    needs: check_release_binaries_ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Test trimAl for Linux x86_64
        run: curl -L -o trimal_linux.zip https://github.com/inab/trimal/releases/latest/download/trimAl_Linux_x86-64.zip &&
          unzip trimal_linux.zip && mv trimAl_Linux_x86-64/* source/ && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh
          
  build_ubuntu:
    #if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build trimAl for Linux x86_64
        if: matrix.arch == 'x86_64'
        run: cd source && make all && file trimal && file readal && file statal && tar -cvf trimal_bin.tar trimal
      - name: Upload build binaries for Linux x86_64
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: trimal_linux_x86_64
          path: source/trimal_bin.tar
          overwrite: true
          retention-days: 1
          if-no-files-found: error
      - name: Build trimAl for Linux aarch64
        if: matrix.arch == 'aarch64'
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/trimal" 
          install: |
            apt-get update -q -y
            apt-get install -q -y make g++ file
          run: |
            cd /trimal/source && make all && file trimal && file readal && file statal && tar -cvf trimal_bin.tar trimal
      - name: Upload build binaries for Linux aarch64
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: trimal_linux_aarch64
          path: source/trimal_bin.tar
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  test_ubuntu:
    #if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    needs: build_ubuntu
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Download build binaries for Linux x86_64
        if: matrix.arch == 'x86_64'
        uses: actions/download-artifact@v4
        with:
          name: trimal_linux_x86_64
          path: source
      - name: Test trimAl for Linux x86_64
        if: matrix.arch == 'x86_64'
        run: tar -xvf source/trimal_bin.tar -C source && source/trimal && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh
      - name: Download build binaries for Linux aarch64
        if: matrix.arch == 'aarch64'
        uses: actions/download-artifact@v4
        with:
          name: trimal_linux_aarch64
          path: source
      - name: Test trimAl for Linux aarch64
        if: matrix.arch == 'aarch64'
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/trimal" 
          run: tar -xvf source/trimal_bin.tar -C source && source/trimal && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh

  check_release_binaries_macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Download Release Binaries
        run: |
          curl -L -o trimal_macos.zip https://github.com/inab/trimal/releases/latest/download/trimAl_MacOS_x86-64.zip &&
          unzip trimal_macos.zip && mv trimAl_MacOS_x86-64/* source/
      - name: Test trimal for MacOS x86_64
        run: file source/trimal && file source/readal && file source/statal
          
  test_binaries_macos:
    #if: ${{ github.event_name == 'push' }}
    runs-on: macos-13
    needs: check_release_binaries_macos
    steps:
      - uses: actions/checkout@v4
      - name: Test trimAl for MacOS
        run: |
          curl -L -o trimal_macos.zip https://github.com/inab/trimal/releases/latest/download/trimAl_MacOS_x86-64.zip &&
          unzip trimal_macos.zip && mv trimAl_MacOS_x86-64/* source/ && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh

  build_macos:
    strategy:
      matrix:
        version: [macos-13, macos-14]
    runs-on: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build trimAl for ${{ matrix.version }}
        run: cd source && make all && file trimal && file readal && file statal && tar -cvf trimal_bin.tar trimal
      - name: Upload build binaries for ${{ matrix.version }}
        uses: actions/upload-artifact@v4
        with:
          name: trimal_${{ matrix.version }}
          path: source/trimal_bin.tar
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  
  test_macos:
    strategy:
      matrix:
        version: [macos-13, macos-14]
    runs-on: ${{ matrix.version }}
    needs: build_macos
    steps:
      - uses: actions/checkout@v4
      - name: Download build binaries for ${{ matrix.version }}
        uses: actions/download-artifact@v4
        with:
          name: trimal_${{ matrix.version }}
          path: source
      - name: Test trimAl for ${{ matrix.version }}
        run: |
          tar -xvf source/trimal_bin.tar -C source && source/trimal &&
          ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh

  check_release_binaries_windows:
    runs-on: windows-2022
    steps:
      - name: Download Release Binaries
        run: |
          curl -L -o trimal_windows.zip https://github.com/inab/trimal/releases/latest/download/trimAl_Windows_x86-64.zip
          powershell -Command "Expand-Archive -Path trimal_windows.zip -DestinationPath ."
          Move-Item -Path .\trimal.exe -Destination .\source\
      - name: Check release binaries
        run: |
          Get-Command .\source\trimal.exe

  test_binaries_windows:
    runs-on: windows-2022
    needs: check_release_binaries_windows
    steps:
      - uses: actions/checkout@v4
      - name: Download Release Binaries
        run: |
          curl -L -o trimal_windows.zip https://github.com/inab/trimal/releases/latest/download/trimAl_Windows_x86-64.zip
          powershell -Command "Expand-Archive -Path trimal_windows.zip -DestinationPath ."
          Move-Item -Path .\trimal.exe -Destination .\source\
      - name: Test trimAl for Windows
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\generate_trimmed_msas.ps1
          powershell -ExecutionPolicy Bypass -File .\scripts\compare_trimmed_msas.ps1

  build_windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            file
      - name: Build trimAl for Windows
        run: |
          cd source
          make -f makefile.Windows
          file trimal.exe
          file readal.exe
          file statal.exe
          tar -cvf trimal_bin.tar trimal.exe
      - name: Upload build binaries for Windows
        uses: actions/upload-artifact@v4
        with:
          name: trimal_windows
          path: source/trimal_bin.tar
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  test_windows:
    runs-on: windows-2022
    needs: build_windows
    steps:
      - uses: actions/checkout@v4
      - name: Download build binaries for Windows
        uses: actions/download-artifact@v4
        with:
          name: trimal_windows
          path: source
      - name: Test trimAl for Windows
        run: |
          tar -xvf source/trimal_bin.tar -C source
          powershell -ExecutionPolicy Bypass -File .\scripts\generate_trimmed_msas.ps1
          powershell -ExecutionPolicy Bypass -File .\scripts\compare_trimmed_msas.ps1
