on:
  push:
    branches:
      - trimAl
    paths:
      - '.github/workflows/build.yml'
      - 'dataset/**'
      - 'scripts/**'
      - 'source/**'
  pull_request:
    branches:
      - trimAl
    paths:
      - '.github/workflows/build.yml'
      - 'dataset/**'
      - 'scripts/**'
      - 'source/**'

name: Build 

jobs:
  download_binaries_ubuntu:
    #if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download release binaries
        run: |
          curl -L -o trimal.zip https://github.com/inab/trimal/releases/latest/download/trimAl_Linux_x86-64.zip &&
          unzip trimal.zip && cd trimAl_Linux_x86-64 && file trimal && file readal && file statal
      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: trimal
          path: trimAl_Linux_x86-64/trimal
          overwrite: true
          retention-days: 1
          if-no-files-found: error
          
  test_binaries_ubuntu:
    #if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    needs: download_binaries_ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: Download executable file
        uses: actions/download-artifact@v4
        with:
          name: trimal
          path: source/trimal
      - name: Test trimAl for Linux x86_64
        run: unzip source/trimal.zip && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh
          
  build_and_test_ubuntu:
    if: false # TODO: change before merge
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        
    steps:
      - uses: actions/checkout@v4
      - name: Build trimAl for Linux x86_64
        if: matrix.arch == 'x86_64'
        run: cd source && make all && file trimal && file readal && file statal &&
          cd .. && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh

      - name: Build trimAl for Linux aarch64
        if: ${{ matrix.arch == 'aarch64' && github.event_name == 'push' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}:/trimal" 
          install: |
            apt-get update -q -y
            apt-get install -q -y make g++ file
          run: |
            cd /trimal/source && make all && file trimal && file readal && file statal &&
            cd .. && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh

  download_and_test_macos:
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Download Release Binaries
        run: |
          curl -L -o trimal.zip https://github.com/inab/trimal/releases/latest/download/trimAl_MacOS_x86-64.zip &&
          unzip trimal.zip && mv trimAl_MacOS_x86-64/* source/
      - name: Test trimal for MacOS x86_64
        run: file source/trimal && file source/readal && file source/statal && ./scripts/generate_trimmed_msas.sh &&
          ./scripts/compare_trimmed_msas.sh

  build_and_test_macos:
    if: ${{ github.event_name == 'push' }}
    strategy:
      matrix:
        version: [macos-13, macos-14]
    runs-on: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build trimAl for MacOS ${{ matrix.version }}
        run: cd source && make all && file trimal && file readal && file statal &&
          cd .. && ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh

  download_and_test_windows:
      if: ${{ github.event_name == 'push' }}
      runs-on: windows-2022
      steps:
      - uses: actions/checkout@v4
      - name: Download Release Binaries
        run: |
          curl -L -o trimal.zip https://github.com/inab/trimal/releases/latest/download/trimAl_Windows_x86-64.zip

      - name: Unzip Binaries
        run: |
          powershell -Command "Expand-Archive -Path trimal.zip -DestinationPath ."
        
      - name: Verify Binaries
        run: |
          Move-Item -Path .\trimal.exe -Destination .\source\
          Get-Command .\source\trimal.exe
          
      - name: Run generate_trimmed_msas.ps1
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\generate_trimmed_msas.ps1

      - name: Run compare_trimmed_msas.ps1
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\compare_trimmed_msas.ps1
          
  build_and_test_windows:
      if: ${{ github.event_name == 'push' }}
      runs-on: windows-2022
      steps:
        - uses: actions/checkout@v4
        - name: Set up MSYS2
          uses: msys2/setup-msys2@v2
          with:
            msystem: MINGW64
            update: true
            install: >-
              make
              mingw-w64-x86_64-gcc
              file
        - name: Build trimAl for Windows x86_64
          run: |
            cd source
            make -f makefile.Windows
            file trimal.exe
            file readal.exe
            file statal.exe
        - name: Run generate_trimmed_msas.ps1
          run: |
            powershell -ExecutionPolicy Bypass -File .\scripts\generate_trimmed_msas.ps1
  
        - name: Run compare_trimmed_msas.ps1
          run: |
            powershell -ExecutionPolicy Bypass -File .\scripts\compare_trimmed_msas.ps1
